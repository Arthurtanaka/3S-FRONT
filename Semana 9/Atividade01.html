<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Ex01 — Validador de CPF</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 40px 20px; }
        .card { background: white; border-radius: 8px; padding: 32px; width: 100%; max-width: 480px; border-top: 5px solid #e67e22; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h2 { color: #e67e22; margin-bottom: 20px; }
        label { display: block; font-size: 0.85rem; font-weight: bold; color: #555; margin-bottom: 6px; }
        input { width: 100%; padding: 10px 12px; border: 1.5px solid #ccc; border-radius: 6px; font-size: 1rem; outline: none; }
        input:focus { border-color: #e67e22; }
        button { margin-top: 16px; width: 100%; padding: 11px; background: #2c3e50; color: white; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #3d5166; }
        .resultado { margin-top: 16px; padding: 12px 16px; border-radius: 6px; font-size: 0.95rem; display: none; }
        .verde    { background: #e8f5ee; color: #1a7a4a; border: 1px solid #a8dbc0; display: block; }
        .vermelho { background: #fdecea; color: #c0392b; border: 1px solid #f5b7b1; display: block; }
    </style>
</head>
<body>
<div class="card">
    <h2> Exercício 01: Validador de CPF</h2>

    <label>Número do CPF</label>
    <input type="text" id="cpf-input" placeholder="000.000.000-00" maxlength="14">

    <button onclick="validarCPF()">Validar CPF</button>
    <div class="resultado" id="resultado"></div>
</div>

<script>
function validarCPF() {
    var input = document.getElementById('cpf-input').value;
    var resultado = document.getElementById('resultado');

    // Remove tudo que não for número
    var cpf = '';
    for (var i = 0; i < input.length; i++) {
        if (input[i] >= '0' && input[i] <= '9') {
            cpf += input[i];
        }
    }

    // Verifica se tem exatamente 11 dígitos
    if (cpf.length !== 11) {
        resultado.textContent = '❌ CPF inválido — precisa ter 11 dígitos.';
        resultado.className = 'resultado vermelho';
        return;
    }

    // Rejeita sequências iguais (ex: 111.111.111-11)
    var todosIguais = true;
    for (var i = 1; i < 11; i++) {
        if (cpf[i] !== cpf[0]) {
            todosIguais = false;
            break;
        }
    }
    if (todosIguais) {
        resultado.textContent = '❌ CPF inválido — dígitos todos iguais.';
        resultado.className = 'resultado vermelho';
        return;
    }

    // Calcula o 1º dígito verificador
    // Multiplica os 9 primeiros dígitos por 10, 9, 8... até 2
    var soma = 0;
    for (var i = 0; i < 9; i++) {
        soma += Number(cpf[i]) * (10 - i);
    }
    var resto = (soma * 10) % 11;
    if (resto === 10) resto = 0;

    if (resto !== Number(cpf[9])) {
        resultado.textContent = '❌ CPF inválido — 1º dígito verificador incorreto.';
        resultado.className = 'resultado vermelho';
        return;
    }

    // Calcula o 2º dígito verificador
    // Multiplica os 10 primeiros dígitos por 11, 10, 9... até 2
    soma = 0;
    for (var i = 0; i < 10; i++) {
        soma += Number(cpf[i]) * (11 - i);
    }
    resto = (soma * 10) % 11;
    if (resto === 10) resto = 0;

    if (resto !== Number(cpf[10])) {
        resultado.textContent = '❌ CPF inválido — 2º dígito verificador incorreto.';
        resultado.className = 'resultado vermelho';
        return;
    }

    // CPF válido — formata e exibe
    var formatado = cpf[0]+cpf[1]+cpf[2]+'.'+cpf[3]+cpf[4]+cpf[5]+'.'+cpf[6]+cpf[7]+cpf[8]+'-'+cpf[9]+cpf[10];
    resultado.textContent = '✅ CPF válido: ' + formatado;
    resultado.className = 'resultado verde';
}

// Permite validar pressionando Enter
document.getElementById('cpf-input').addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
        validarCPF();
    }
});
</script>
</body>
</html>
