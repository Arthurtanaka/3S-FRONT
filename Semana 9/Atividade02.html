<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Ex02 — Conversor de Temperatura</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 40px 20px; }
        .card { background: white; border-radius: 8px; padding: 32px; width: 100%; max-width: 480px; border-top: 5px solid #e67e22; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h2 { color: #e67e22; margin-bottom: 20px; }
        label { display: block; font-size: 0.85rem; font-weight: bold; color: #555; margin-bottom: 6px; }
        input { width: 100%; padding: 10px 12px; border: 1.5px solid #ccc; border-radius: 6px; font-size: 1rem; outline: none; }
        input:focus { border-color: #e67e22; }
        .linha { display: flex; align-items: center; gap: 16px; }
        .campo { flex: 1; }
        .seta { font-size: 1.6rem; color: #e67e22; padding-top: 18px; }
        .dica { margin-top: 20px; background: #eaf1fb; color: #1a5fa8; border: 1px solid #aac8ed; border-radius: 6px; padding: 12px 16px; font-size: 0.88rem; line-height: 1.6; }
    </style>
</head>
<body>
<div class="card">
    <h2>Exercício 02: Conversor de Temperatura</h2>

    <div class="linha">
        <div class="campo">
            <label>Celsius (°C)</label>
            <input type="number" id="celsius" step="0.1" placeholder="Ex: 25" oninput="celsiusParaF()">
        </div>
        <div class="seta">⇄</div>
        <div class="campo">
            <label>Fahrenheit (°F)</label>
            <input type="number" id="fahrenheit" step="0.1" placeholder="Ex: 77" oninput="fahrenheitParaC()">
        </div>
    </div>

    <div class="dica">
        💡 <strong>Fórmulas usadas:</strong><br>
        °F = (°C × 9/5) + 32<br>
        °C = (°F − 32) × 5/9
    </div>
</div>

<script>
function celsiusParaF() {
    var c = Number(document.getElementById('celsius').value);
    var resultado = (c * 9 / 5) + 32;
    document.getElementById('fahrenheit').value = resultado.toFixed(2);
}

function fahrenheitParaC() {
    var f = Number(document.getElementById('fahrenheit').value);
    var resultado = (f - 32) * 5 / 9;
    document.getElementById('celsius').value = resultado.toFixed(2);
}
</script>
</body>
</html>
